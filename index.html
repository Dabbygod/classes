<!-- KEYBIND + CLOAK SCRIPT -->

<script>

/* =========================
   KEYBIND SYSTEM
========================= */

document.addEventListener("DOMContentLoaded", () => {

    const input =
        document.getElementById("keybind-input");

    const saved =
        document.getElementById("saved-key");

    if (!input || !saved) return;

    // LOAD SAVED KEY

    const savedKey =
        localStorage.getItem("exitKey")
        || "BracketRight";

    saved.innerText =
        "Current Keybind: " + savedKey;

    input.value = savedKey;

    // CLICK INPUT

    input.addEventListener("click", () => {

        input.focus();
    });

    // SAVE NEW KEY

    input.addEventListener("keydown", (e) => {

        e.preventDefault();

        const key = e.code;

        localStorage.setItem("exitKey", key);

        saved.innerText =
            "Current Keybind: " + key;

        input.value = key;
    });

});

/* =========================
   ABOUT:BLANK CLOAK
========================= */

function openBlankCloak() {

    const win =
        window.open("about:blank", "_blank");

    if (!win) {

        alert("Popup blocked!");

        return;
    }

    win.document.write(`

        <!DOCTYPE html>

        <html>

        <head>

            <title>Classroom</title>

            <link rel="icon"
            href="https://ssl.gstatic.com/classroom/favicon.png">

            <style>

                html, body {

                    margin: 0;

                    width: 100%;

                    height: 100%;

                    overflow: hidden;
                }

                iframe {

                    width: 100%;

                    height: 100%;

                    border: none;
                }

            </style>

        </head>

        <body>

            <iframe src="index.html"></iframe>

            <script>

            window.addEventListener("keydown", (e) => {

                const key =
                    localStorage.getItem("exitKey")
                    || "BracketRight";

                if (e.code === key) {

                    window.location.href =
                        "https://classroom.google.com";
                }

            });

            <\/script>

        </body>

        </html>

    `);

    win.document.close();
}

</script>
