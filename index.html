<!-- ✅ KEYBIND SCRIPT (ONLY ONE) -->
<script>
document.addEventListener("DOMContentLoaded", () => {

    const input = document.getElementById("keybind-input");
    const saved = document.getElementById("saved-key");

    if (!input || !saved) return;

    // Load saved keybind
    const savedKey = localStorage.getItem("exitKey") || "]";

    saved.innerText = "Current Keybind: " + savedKey;
    input.value = savedKey;

    // Set new keybind (ONLY ONE listener)
    input.addEventListener("keydown", (e) => {

        e.preventDefault();

        const key = e.code;

        localStorage.setItem("exitKey", key);

        saved.innerText = "Current Keybind: " + key;
        input.value = key;
    });

    // Click to focus
    input.addEventListener("click", () => {
        input.focus();
    });

});
</script>
