<script>
// KEYBIND SETTINGS
document.addEventListener("DOMContentLoaded", () => {
    const input = document.getElementById("keybind-input");
    const saved = document.getElementById("saved-key");

    const savedKey = localStorage.getItem("exitKey") || "BracketRight";
    saved.innerText = "Current Keybind: " + savedKey;
    input.value = savedKey;

    input.addEventListener("click", () => input.focus());

    input.addEventListener("keydown", (e) => {
        e.preventDefault();
        const key = e.code;
        localStorage.setItem("exitKey", key);
        input.value = key;
        saved.innerText = "Current Keybind: " + key;
    });
});
</script>

<script>
window.openBlankCloak = function () {
    const popup = window.open("about:blank", "_blank");

    if (!popup) {
        alert("Popup blocked!");
        return;
    }

    const EXIT_KEY = localStorage.getItem("exitKey") || "BracketRight";

    popup.document.write(`
<!DOCTYPE html>
<html>
<head>
    <title>Classroom</title>
    <link rel="icon" href="https://ssl.gstatic.com/classroom/favicon.png">

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

<body>

    <iframe id="cloak-frame" src="index.html"></iframe>

<script>
let EXIT_KEY = "BracketRight";

window.addEventListener("message", (event) => {
    if (event.data.exitKey) {
        EXIT_KEY = event.data.exitKey;
    }
});

const frame = document.getElementById("cloak-frame");

window.addEventListener("keydown", (e) => {
    if (e.code === EXIT_KEY) {
        frame.src = "index.html";
        window.focus();
    }
});
<\/script>

</body>
</html>
    `);

    popup.document.close();

    // SEND EXIT KEY TO POPUP
    popup.onload = () => {
        popup.postMessage({ exitKey: EXIT_KEY }, "*");
    };
};
</script>
