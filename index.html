<body>

    Back To Top

<script>

/* =========================
   KEYBIND SETTINGS
========================= */

document.addEventListener("DOMContentLoaded", () => {

    const input =
        document.getElementById("keybind-input");

    const saved =
        document.getElementById("saved-key");

    if (!input || !saved) return;

    // LOAD SAVED KEY

    const savedKey =
        localStorage.getItem("exitKey")
        || "BracketRight";

    saved.innerText =
        "Current Keybind: " + savedKey;

    input.value = savedKey;

    // FOCUS INPUT

    input.addEventListener("click", () => {

        input.focus();
    });

    // SAVE KEYBIND

    input.addEventListener("keydown", (e) => {

        e.preventDefault();

        const key = e.code;

        localStorage.setItem("exitKey", key);

        input.value = key;

        saved.innerText =
            "Current Keybind: " + key;

    });

});


/* =========================
   ABOUT:BLANK CLOAK
========================= */

window.openBlankCloak = function () {

    const popup =
        window.open("about:blank", "_blank");

    if (!popup) {

        alert("Popup blocked!");

        return;
    }

    popup.document.write(`

<!DOCTYPE html>

<html>

<head>

    <title>Classroom</title>

    <link rel="icon"
    href="https://ssl.gstatic.com/classroom/favicon.png">

    <style>

        html, body {

            margin: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;
        }

        iframe {

            width: 100%;
            height: 100%;

            border: none;
        }

    </style>

</head>

<body>

    <iframe
        id="cloak-frame"
        src="index.html">
    </iframe>

<script>

    function getKey() {

        return localStorage.getItem("exitKey")
            || "BracketRight";
    }

    const frame =
        document.getElementById("cloak-frame");

    win.addEventListener("keydown", (e) => {
    const key = getKey();
    if (e.code === key) {
        frame.src = "index.html";
    }
});

    // IFRAME KEYBIND

function attachKeybind() {

    try {

        const win =
            frame.contentWindow;

        win.addEventListener("keydown", (e) => {

            const key = getKey();

            if (e.code === key) {

                frame.src = "index.html";
            }

        });

    } catch (err) {

        console.log(
            "iframe blocked:",
            err
        );
    }

}

// attach every time iframe changes page
frame.addEventListener("load", attachKeybind);

<\\/script>

</body>

</html>

    `);

    popup.document.close();
};
window.addEventListener("keydown", (e) => {

    // don't trigger while typing
    const active =
        document.activeElement;

    if (
        active &&
        (
            active.tagName === "INPUT" ||
            active.tagName === "TEXTAREA"
        )
    ) {
        return;
    }

    const key =
        localStorage.getItem("exitKey")
        || "BracketRight";

    // MAIN PAGE EXIT
    if (e.code === key) {

        // go back home
        window.location.href =
            "index.html";
    }

});

</script>
