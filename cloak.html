<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Classroom</title>

    <link rel="icon" href="https://ssl.gstatic.com/classroom/favicon.png">

    <script src="cloak.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: white;
        }

        #main-frame {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Home button */
        #global-home-btn {
            position: fixed;
            top: 20px;
            left: 20px;

            padding: 10px 16px;
            font-size: 16px;

            background: #4a90e2;
            color: white;

            border: none;
            border-radius: 10px;

            cursor: pointer;

            z-index: 999999;

            opacity: 0;
            pointer-events: none;

            transition: opacity 0.2s ease;
        }

        #global-home-btn.show {
            opacity: 1;
            pointer-events: auto;
        }

        /* Keybind hint */
        #keybind-hint {
            position: fixed;
            bottom: 15px;
            right: 15px;

            background: rgba(0,0,0,0.7);
            color: white;

            padding: 8px 12px;
            border-radius: 8px;

            font-size: 14px;

            z-index: 999999;
        }
    </style>
</head>

<body>

    <iframe id="main-frame" src="index.html"></iframe>

    <button id="global-home-btn">Home</button>

    <div id="keybind-hint"></div>

    <script>
function getKey() {
    return localStorage.getItem("exitKey") || "]";
}

window.addEventListener("keydown", (e) => {

    const key = getKey();

    if (e.key === key) {

        // Go to homepage
        window.location.href = "index.html";
    }
});
    // Also try inside iframe (if allowed)
    iframe.onload = () => {

        try {

            const win = iframe.contentWindow;

            win.addEventListener("keydown", (e) => {

                const key = getKey();

                if (e.key === key) {

                    iframe.src = "index.html";

                    showButton();
                }
            });

        } catch (err) {
            console.log("Iframe keybind blocked:", err);
        }
    };

    </script>

</body>
</html>
