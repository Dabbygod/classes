<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Classroom</title>

    <link rel="icon" href="https://ssl.gstatic.com/classroom/favicon.png">

    <script src="cloak.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: white;
        }

        #main-frame {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Floating Home Button */
        #global-home-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 10px 16px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            background: #4a90e2;
            color: white;
            cursor: pointer;
            z-index: 999999;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);

            opacity: 0;
            pointer-events: none;

            transition: opacity 0.25s ease;
        }

        #global-home-btn.show {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>

<body>

    <!-- Main iframe -->
    <iframe id="main-frame" src="index.html"></iframe>

    <!-- Floating Home Button -->
    <button id="global-home-btn">
        Home
    </button>

    <script>
    const iframe = document.getElementById("main-frame");
    const homeBtn = document.getElementById("global-home-btn");

    // Home button click
    homeBtn.onclick = () => {
        iframe.src = "index.html";
    };

    // Show/hide button based on iframe scrolling
    function setupScrollDetection() {

        try {

            const win = iframe.contentWindow;
            const doc = iframe.contentDocument;

            let lastScroll = 0;

            function handleScroll() {

                const currentScroll =
                    win.scrollY ||
                    doc.documentElement.scrollTop ||
                    doc.body.scrollTop ||
                    0;

                // Show when scrolling UP
                if (currentScroll < lastScroll && currentScroll > 50) {
                    homeBtn.classList.add("show");
                } else {
                    homeBtn.classList.remove("show");
                }

                lastScroll = currentScroll;
            }

            // Listen for scrolling
            win.addEventListener("scroll", handleScroll);

        } catch (err) {

            console.log("Scroll detection failed:", err);

            // Always show button if iframe access blocked
            homeBtn.classList.add("show");
        }
    }

    // Force game links into iframe
    function forceGamesIntoIframe() {

        try {

            const doc = iframe.contentDocument;

            doc.addEventListener("click", (e) => {

                const link = e.target.closest("a");
                if (!link) return;

                const href = link.getAttribute("href");
                if (!href) return;

                // Load internal HTML pages inside iframe
                if (href.endsWith(".html")) {

                    e.preventDefault();

                    iframe.src = href;
                }
            });

        } catch (err) {

            console.log("Could not intercept links:", err);
        }
    }

    // When iframe loads
    iframe.onload = () => {

        setupScrollDetection();
        forceGamesIntoIframe();
    };
    </script>

</body>
</html>
