<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Classroom</title>
    <link rel="icon" href="https://ssl.gstatic.com/classroom/favicon.png">
    <script src="cloak.js"></script>

    <style>
        html, body { margin:0; padding:0; height:100%; overflow:hidden; }
        #main-frame { width:100%; height:100%; border:none; }
    </style>
</head>

<body>
    <iframe id="main-frame"></iframe>

    <script>
    function injectHomeButtonIntoGame() {
        const iframe = document.querySelector("#main-frame");

        if (!iframe) return;

        iframe.onload = () => {
            try {
                const doc = iframe.contentDocument || iframe.contentWindow.document;

                // Create button
                const btn = doc.createElement("button");
                btn.innerText = "Home";
                btn.style.position = "fixed";
                btn.style.top = "20px";
                btn.style.left = "20px";
                btn.style.padding = "10px 16px";
                btn.style.fontSize = "16px";
                btn.style.border = "none";
                btn.style.borderRadius = "8px";
                btn.style.background = "#4a90e2";
                btn.style.color = "white";
                btn.style.cursor = "pointer";
                btn.style.zIndex = "9999";
                btn.style.display = "none";

                // Scroll-up detection
                let lastScroll = 0;
                doc.addEventListener("scroll", () => {
                    const currentScroll = doc.documentElement.scrollTop;

                    if (currentScroll < lastScroll && currentScroll > 50) {
                        btn.style.display = "block";
                    } else {
                        btn.style.display = "none";
                    }

                    lastScroll = currentScroll;
                });

                // Home button action
                btn.onclick = () => {
                    window.location.href = "index.html";
                };

                doc.body.appendChild(btn);

            } catch (e) {
                console.log("Could not inject button:", e);
            }
        };
    }

    injectHomeButtonIntoGame();
    </script>
</body>
</html>
