<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Classroom</title>

    <link rel="icon" href="https://ssl.gstatic.com/classroom/favicon.png">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: white;
        }

        #main-frame {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

<body>

    <iframe id="main-frame" src="index.html"></iframe>

    <script>
    const iframe = document.getElementById("main-frame");

    function getKey() {
        return localStorage.getItem("exitKey") || "BracketRight";
    }

    // MAIN KEYBIND (OUTSIDE iframe)
    window.addEventListener("keydown", (e) => {

        const key = getKey();

        if (e.code === key) {
            window.location.href = "index.html";
        }
    });

    // OPTIONAL: inside iframe (if allowed)
    iframe.onload = () => {

        try {

            const win = iframe.contentWindow;

            win.addEventListener("keydown", (e) => {

                const key = getKey();

                if (e.code === key) {
                    iframe.src = "index.html";
                }
            });

        } catch (err) {
            console.log("Iframe blocked:", err);
        }
    };
    </script>

</body>
</html>
