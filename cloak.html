<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Classroom</title>

    <link rel="icon"
          href="https://ssl.gstatic.com/classroom/favicon.png">

    <script src="cloak.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: white;
            font-family: Arial, sans-serif;
        }

        #main-frame {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Floating Home Button */
        #global-home-btn {
            position: fixed;
            top: 20px;
            left: 20px;

            padding: 10px 16px;

            border: none;
            border-radius: 10px;

            background: #4a90e2;
            color: white;

            font-size: 16px;
            cursor: pointer;

            z-index: 999999;

            opacity: 0;
            pointer-events: none;

            transition: opacity 0.25s ease;
        }

        #global-home-btn.show {
            opacity: 1;
            pointer-events: auto;
        }

        /* Small keybind label */
        #keybind-display {
            position: fixed;
            bottom: 15px;
            right: 15px;

            background: rgba(0,0,0,0.65);
            color: white;

            padding: 8px 12px;

            border-radius: 8px;

            font-size: 14px;

            z-index: 999999;
        }
    </style>
</head>

<body>

    <!-- Main iframe -->
    <iframe
        id="main-frame"
        src="index.html">
    </iframe>

    <!-- Floating Home Button -->
    <button id="global-home-btn">
        Home
    </button>

    <!-- Keybind Display -->
    <div id="keybind-display"></div>

    <script>
    const iframe =
        document.getElementById("main-frame");

    const homeBtn =
        document.getElementById("global-home-btn");

    const keybindDisplay =
        document.getElementById("keybind-display");

    // Default exit key
    let exitKey =
        localStorage.getItem("exitKey") || "]";

    // Show current keybind
    keybindDisplay.innerText =
        "Exit Key: " + exitKey;

    // Home button action
    homeBtn.onclick = () => {
        iframe.src = "index.html";
    };

    // Show button temporarily
    let hideTimeout;

    function showHomeButton() {

        homeBtn.classList.add("show");

        clearTimeout(hideTimeout);

        hideTimeout = setTimeout(() => {

            homeBtn.classList.remove("show");

        }, 1500);
    }

    // Detect mouse wheel on iframe
    iframe.addEventListener("wheel", (e) => {

        // Scroll UP
        if (e.deltaY < 0) {
            showHomeButton();
        }

    });

    // Detect touch movement
    iframe.addEventListener("touchmove", () => {
        showHomeButton();
    });

    // Global keybind listener
    window.addEventListener("keydown", (e) => {

        exitKey =
            localStorage.getItem("exitKey") || "]";

        // Go home
        if (e.key === exitKey) {

            iframe.src = "index.html";

            showHomeButton();
        }
    });

    // Force links into iframe
    function forceGamesIntoIframe() {

        try {

            const doc =
                iframe.contentDocument ||
                iframe.contentWindow.document;

            doc.addEventListener("click", (e) => {

                const link =
                    e.target.closest("a");

                if (!link) return;

                const href =
                    link.getAttribute("href");

                if (!href) return;

                // Load internal HTML pages inside iframe
                if (href.endsWith(".html")) {

                    e.preventDefault();

                    iframe.src = href;
                }
            });

        } catch(err) {

            console.log(
                "Could not intercept links:",
                err
            );
        }
    }

    // Re-setup when iframe changes
    iframe.onload = () => {

        forceGamesIntoIframe();

        // Try keybind inside iframe too
        try {

            const win =
                iframe.contentWindow;

            win.addEventListener(
                "keydown",
                (e) => {

                exitKey =
                    localStorage.getItem("exitKey") || "]";

                if (e.key === exitKey) {

                    iframe.src = "index.html";

                    showHomeButton();
                }
            });

        } catch(err) {

            console.log(
                "Iframe keyboard hook failed:",
                err
            );
        }
    };
    </script>

</body>
</html>
